# ============================================
# Docker Compose - بيئة التطوير المحلية
# PostgreSQL + pgvector + Redis
# ============================================

services:
  # قاعدة بيانات PostgreSQL مع امتداد pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: informatics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: informatics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d informatics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis للمهام الخلفية وتحديد المعدل
  redis:
    image: redis:7-alpine
    container_name: informatics_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
